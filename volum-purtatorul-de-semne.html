        // Render poems
        const grid = document.getElementById('poemsGrid');
        poems.forEach((poem, index) => {
            const card = document.createElement('div');
            card.className = 'poem-card';
            card.onclick = () => openModal(poem.title, poem.text);
            
            const preview = poem.text.split('\n').slice(0, 3).join('\n');
            
            card.innerHTML = `
                <div class="poem-number">#${index + 1}</div>
                <h3 class="poem-title">${poem.title}</h3>
                <div class="poem-preview">${preview}...</div>
                <span class="read-more">Citește integral →</span>
            `;
            
            grid.appendChild(card);
        });

        function openModal(title, text) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('poemModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('poemModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('poemModal').addEventListener('click', (e) => {
            if (e.target.id === 'poemModal') {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
