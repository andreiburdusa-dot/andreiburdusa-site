<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>haiku - Violeta-Mirela Mareș</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Libre Baskerville', Georgia, serif;
    background: linear-gradient(135deg, #faf7f2 0%, #e8ddd0 100%);
    color: #3b2f2f;
    line-height: 1.8;
    min-height: 100vh;
    padding: 2rem;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    padding: 3rem;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(59,47,47,0.1);
  }

  .back-link {
    display: inline-block;
    color: #c9a96e;
    text-decoration: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    margin-bottom: 2rem;
    transition: color 0.3s;
  }

  .back-link:hover {
    color: #8b4513;
  }

  .poem-header {
    text-align: center;
    margin-bottom: 3rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid #e8ddd0;
  }

  .poem-header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.5rem;
    font-weight: 300;
    color: #8b4513;
    margin-bottom: 0.5rem;
  }

  .poem-header .autor {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: #c9a96e;
  }

  .poem-image {
    width: 100%;
    max-height: 500px;
    object-fit: cover;
    object-position: center top;
    border-radius: 8px;
    margin-bottom: 3rem;
    box-shadow: 0 4px 20px rgba(59,47,47,0.15);
  }

  .poem-content {
    font-family: 'Libre Baskerville', serif;
    font-size: 1.1rem;
    line-height: 2.2;
    color: #3b2f2f;
    white-space: pre-line;
    text-align: left;
  }

  @media (max-width: 768px) {
    body {
      padding: 1rem;
    }

    .container {
      padding: 2rem 1.5rem;
    }

    .poem-header h1 {
      font-size: 1.8rem;
    }

    .poem-content {
      font-size: 1rem;
      line-height: 2;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← Înapoi la poeme</a>

    <div class="poem-header">
      <h1>haiku</h1>
      <span class="autor">— Violeta-Mirela Mareș</span>
    </div>

    <img src="images/thea.jpg" alt="Thea" class="poem-image">

    <div class="poem-content">ziua crăpată
pervazul primăverii
năruit și trist</div>
  </div>
</body>
</html>
