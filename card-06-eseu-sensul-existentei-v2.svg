<svg width="100%" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="680" height="680" fill="#12100e"/>
  <rect x="0" y="0" width="680" height="3" fill="#c9a96e"/>
  <rect x="0" y="677" width="680" height="3" fill="#c9a96e"/>
  <rect x="0" y="0" width="4" height="680" fill="#c9a96e" opacity="0.4"/>
  <rect x="676" y="0" width="4" height="680" fill="#c9a96e" opacity="0.4"/>

  <text font-family="'Georgia', serif" font-size="11" fill="#c9a96e" letter-spacing="4" text-anchor="middle" x="340" y="55">ANDREI CONSTANTIN BURDUȘA · ESEU #9 · 31 MARTIE 2026</text>
  <line x1="60" y1="75" x2="620" y2="75" stroke="#c9a96e" stroke-width="0.5" opacity="0.4"/>

  <text font-family="'Georgia', serif" font-size="13" font-style="italic" fill="#888888" letter-spacing="2" text-anchor="middle" x="340" y="125">Lentilele și Entitatea</text>

  <text font-family="'Georgia', serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle" x="340" y="185">Sensul ca condiție</text>
  <text font-family="'Georgia', serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle" x="340" y="228">a existenței.</text>
  <text font-family="'Georgia', serif" font-size="22" font-weight="300" font-style="italic" fill="#c9a96e" text-anchor="middle" x="340" y="270">Centrul existenței este menirea.</text>

  <line x1="60" y1="295" x2="620" y2="295" stroke="#c9a96e" stroke-width="0.5" opacity="0.4"/>

  <text font-family="'Georgia', serif" font-size="15" font-style="italic" fill="#cccccc" text-anchor="middle" x="340" y="338">Viktor Frankl, în lagărele naziste, a văzut:</text>
  <text font-family="'Georgia', serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" x="340" y="370">Cei cu un „de ce" găseau un „cum"</text>
  <text font-family="'Georgia', serif" font-size="15" fill="#aaaaaa" text-anchor="middle" x="340" y="395">chiar și în condiții inimaginabile.</text>

  <line x1="60" y1="418" x2="620" y2="418" stroke="#c9a96e" stroke-width="0.5" opacity="0.4"/>

  <text font-family="'Georgia', serif" font-size="14" fill="#888888" text-anchor="middle" x="340" y="458">Aristotel · Spinoza · Sartre · Frankl</text>
  <text font-family="'Georgia', serif" font-size="14" fill="#c9a96e" text-anchor="middle" x="340" y="482">Toți ajung la același punct:</text>
  <text font-family="'Georgia', serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" x="340" y="510">fericirea e subprodusul unei vieți cu sens,</text>
  <text font-family="'Georgia', serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" x="340" y="533">nu scopul în sine.</text>

  <line x1="60" y1="555" x2="620" y2="555" stroke="#c9a96e" stroke-width="0.5" opacity="0.4"/>

  <text font-family="'Georgia', serif" font-size="14" font-style="italic" fill="#cccccc" text-anchor="middle" x="340" y="595">Eseu complet pe</text>
  <text font-family="'Georgia', serif" font-size="17" font-weight="700" fill="#c9a96e" text-anchor="middle" x="340" y="619">andreiburdusa.site</text>
  <text font-family="'Georgia', serif" font-size="11" fill="#444444" letter-spacing="3" text-anchor="middle" x="340" y="655">ANDREIBURDUSA.SITE</text>
</svg>
